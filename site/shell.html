<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품페이지 템플릿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/*APP_CSS*/
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top__brand">
    <h1 class="top__title">상품페이지 템플릿</h1>
    <span class="top__sub">Figma 섹션 → HTML</span>
  </div>
  <div class="seg seg--mode" role="tablist" aria-label="화면">
    <button type="button" role="tab" data-mode="library" aria-selected="true">라이브러리</button>
    <button type="button" role="tab" data-mode="compose" aria-selected="false">조합기</button>
  </div>
  <div class="top__controls">
    <div class="seg" role="group" aria-label="보는 사람" data-view-seg>
      <span class="seg__label">보기</span>
      <button type="button" data-view="designer" aria-pressed="true">디자이너</button>
      <button type="button" data-view="dev" aria-pressed="false">개발자</button>
    </div>
    <div class="seg" role="group" aria-label="기기">
      <span class="seg__label">기기</span>
      <button type="button" data-device="pc" aria-pressed="true">PC 1920</button>
      <button type="button" data-device="tb" aria-pressed="false">TB 1024</button>
      <button type="button" data-device="mo" aria-pressed="false">MO 375</button>
    </div>
  </div>
</header>

<div class="shell" id="library">
  <nav class="side" id="side" aria-label="섹션 목록"></nav>
  <main class="main" id="main"></main>
</div>

<div class="compose" id="compose" hidden></div>

<script>
/*APP_DATA*/
</script>
<script>
/*APP_JS*/
</script>
</body>
</html>
